[options]

; --- Database ---
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_dev_password

; --- Addons paths ---
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; --- Developer settings ---
dev_mode = reload,qweb,werkzeug,xml

; --- Performance ---
workers = 0
max_cron_threads = 1

; --- Logging ---
log_level = info

; --- Server ---
http_port = 8069

; --- Security ---
dbfilter = .*
list_db = True
