services:

  odoo:
    image: odoo:18.0
    platform: linux/amd64
    container_name: odoo18_dev
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - ./custom_modules:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - odoo_data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo_dev_password
    restart: unless-stopped
    networks:
      - odoo_net

  db:
    image: postgres:15
    container_name: odoo18_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_dev_password
    restart: unless-stopped
    networks:
      - odoo_net

volumes:
  odoo_data:
  pg_data:

networks:
  odoo_net:
    driver: bridge
